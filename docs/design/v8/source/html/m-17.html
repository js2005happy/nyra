<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Nyra · m-17 首页</title>
<style>@font-face{font-family:Inter;src:url(/workspace/nyra-design/v5/fonts/InterVariable.ttf);font-weight:100 900}
@font-face{font-family:NotoSC;src:url(/workspace/nyra-design/v5/fonts/NotoSansSC.ttf);font-weight:100 900}
@font-face{font-family:JBM;src:url(/workspace/nyra-design/v5/fonts/JBM-Regular.ttf);font-weight:400}
@font-face{font-family:JBM;src:url(/workspace/nyra-design/v5/fonts/JBM-Bold.ttf);font-weight:700}

:root{
 --frame:#0d0d0d; --canvas:#1a1a1a; --inset:#111111; --surface:#212121; --raised:#242424; --active:#2a2a2a;
 --hover:rgba(255,255,255,.06); --b:rgba(255,255,255,.035); --bs:rgba(255,255,255,.045); --ring:rgba(255,255,255,.1);
 --line:rgba(255,255,255,.07);
 --t1:#ffffff; --t2:#dcdcdc; --t3:#979797; --t4:#6a6a6a; --tr:rgba(255,255,255,.52); --onlight:#141414; --light:#f0f0f0;
 --acc:#007cf7; --acct:#42a0ff; --accs:rgba(0,124,247,.16);
 --ok:#31cf76; --oks:rgba(49,207,118,.12); --warn:#ff9412; --warns:rgba(255,148,18,.16);
 --bad:#ff6069; --bads:rgba(253,47,59,.16);
 --fileb:#74b9ff; --filebs:rgba(116,185,255,.14);
 --ny:#8688ff;
 --sans:Inter,NotoSC,sans-serif; --mono:JBM,NotoSC,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
p,.bub{text-wrap:pretty}
body{background:var(--canvas);color:var(--t1);font-family:var(--sans);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
.row{display:flex;align-items:center}
i,em{font-style:normal}
.sp{flex:1}
.mono{font-family:var(--mono);font-variant-ligatures:none}
.ic{flex:none}
button{font:inherit;border:0}
/* 按钮（PRIM .ui-button）：36/32 高，胶囊用于审批与详情页 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:500;line-height:1;white-space:nowrap;color:var(--t1);background:var(--raised)}
.btn.pri{background:var(--light);color:var(--onlight)}
.btn.ghost{background:transparent;color:var(--t2)}
.btn.sm{height:32px;padding:0 16px;font-size:14px}
.ib{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--t3);flex:none}
.bdg{display:inline-flex;align-items:center;gap:4px;height:22px;padding:2px 8px;border-radius:999px;font-size:13px;font-weight:500;line-height:18px;white-space:nowrap;background:var(--surface);color:var(--t2)}
.bdg.warn{background:var(--warns);color:var(--warn)}
.bdg.ok{background:var(--oks);color:var(--ok)}
.bdg.bad{background:var(--bads);color:var(--bad)}
.bdg.line{background:transparent;box-shadow:inset 0 0 0 1px var(--ring);color:var(--t3)}
.av{color:var(--ny);flex:none;display:block}
.spin{animation:none}

/* ===== 桌面骨架：工作区栏 72 | 侧栏 280 | 主区 ===== */
.app{display:flex;width:100%;height:100%;background:var(--canvas)}
/* server-rail：上 42、左右 7；46 点击区，40 图标圆角 12；选中竖条 3×26 */
.srail{width:72px;flex:none;position:relative;padding:42px 7px 61px;display:flex;flex-direction:column;align-items:center;gap:8px;border-right:1px solid var(--line)}
.srail::before{content:"";position:absolute;left:0;right:0;top:37px;height:1px;background:var(--line)}
.srail .sb{width:46px;height:46px;display:grid;place-items:center;position:relative;flex:none}
.srail .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--ny);color:var(--canvas);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.srail .mark{position:absolute;left:-7px;top:10px;width:3px;height:26px;border-radius:0 4px 4px 0;background:var(--t1)}
.srail .act{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px dashed rgba(255,255,255,.16);color:var(--acct)}
.srail .end{margin-top:auto;display:flex;flex-direction:column;gap:6px;align-items:center}
.srail .rb{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--t3)}

/* 侧栏 280：顶栏 38；搜索 8 12 6 / 框 32；行 62 */
.side{width:280px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0}
.stop{height:38px;flex:none;padding:2px 3px 0 10px;gap:3px;border-bottom:1px solid var(--line)}
.stop .nm{height:28px;padding:0 8px 0 4px;gap:6px;font-size:14px;font-weight:600;line-height:20px;border-radius:999px;margin-right:auto;white-space:nowrap}
.swrap{padding:8px 12px 6px}
.sbox{height:32px;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--bs);padding:0 10px;gap:8px;color:var(--t3);font-size:14px;line-height:18px}
.slist{flex:1;padding:4px 12px 8px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.arow{height:62px;flex:none;padding:8px;gap:8px;border-radius:8px}
.arow.on{background:var(--surface)}
.arow .avw{width:46px;height:46px;position:relative;flex:none;display:grid;place-items:center}
.arow .felt{position:absolute;right:-6px;bottom:-4px;min-width:22px;height:22px;border-radius:999px;border:3px solid var(--canvas);background:linear-gradient(#705083,#4a285c);color:#f6efe2;font-size:13px;font-weight:600;line-height:16px;text-align:center;padding:0 3px}
.arow.on .felt{border-color:var(--surface)}
.arow .cp{flex:1;min-width:0}
.arow .hd{gap:8px;align-items:baseline}
.arow .tt{display:flex;align-items:center;gap:5px;min-width:0;flex:1;overflow:hidden}
.arow .tt b{font-size:15px;font-weight:500;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.role{flex:0 1 auto;min-width:0;height:18px;padding:0 4px;border-radius:4px;border:.5px solid var(--b);background:var(--hover);color:var(--tr);font-size:13px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow time{flex:none;color:var(--tr);font-size:13px;line-height:16px;white-space:nowrap}
.wait.ico{width:18px;height:18px;padding:0;justify-content:center}
.wait{flex:none;display:inline-flex;align-items:center;gap:3px;border-radius:999px;background:var(--warns);padding:1px 7px 1px 5px;color:var(--warn);font-size:13px;font-weight:600;line-height:16px;white-space:nowrap}
.arow .pv{display:block;font-size:14px;line-height:18px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.sfoot{gap:8px;padding:10px 20px 14px;color:var(--t2);font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--ok)}

/* 主区：对话 */
.conv{flex:1;min-width:0;display:flex;flex-direction:column}
.chead{height:38px;flex:none;padding:0 12px 0 8px;gap:7px}
.chead .ttl{gap:7px;padding:0 8px;height:28px;border-radius:8px}
.chead .ttl b{font-size:15px;font-weight:500;line-height:20px;white-space:nowrap}
.cscroll{flex:1;min-height:0;overflow:hidden;padding:8px 40px 24px 16px;display:flex;flex-direction:column}
.tm{height:24px;margin:8px auto 16px;padding:4px 0;color:var(--t3);font-size:13px;line-height:16px;text-align:center;flex:none}
.ubub{align-self:flex-end;max-width:min(80%,720px);background:var(--raised);border-radius:22px;padding:8px 12px;font-size:15px;line-height:1.625;letter-spacing:-.15px}
.ent{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:8px;row-gap:4px;margin-top:12px}
.ent .an{grid-column:2;grid-row:1;padding:0 12px;font-size:15px;line-height:22px;color:var(--ny)}
.ent .aa{grid-column:1;grid-row:2;align-self:end;width:36px;height:36px;display:flex;align-items:flex-end}
.ent .grp{grid-column:2;grid-row:2;display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.bub{background:var(--surface);border-radius:22px;padding:8px 12px;font-size:15px;line-height:1.625;letter-spacing:-.15px;max-width:min(80%,720px)}
.bub code{font-family:var(--mono);font-size:13px;background:var(--active);padding:1px 5px;border-radius:5px}
.steps{gap:6px;height:28px;padding:0 12px;color:var(--t3);font-size:14px}
.steps .ok{color:var(--ok)}
.rq{max-width:360px;margin:-1px 0 7px;border-left:2px solid var(--t4);padding-left:8px;color:var(--t2)}
.rq span{display:block;font-size:13px;font-weight:550;line-height:14px;margin-bottom:1px}
.rq p{font-size:13px;line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fref{white-space:nowrap}
.fref .fb{display:inline-block;margin:0 4px 0 2px;padding:0 3px;border-radius:4px;background:var(--filebs);color:var(--fileb);font-size:10px;font-weight:700;line-height:16px;vertical-align:2px;letter-spacing:.2px}
.fref .fn{color:var(--acct)}
/* 审批卡 = muted 气泡，宽 min(540,100%)，padding 16 16 12，间距 12 */
.appr{width:min(540px,100%);background:var(--surface);border-radius:22px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:12px;margin:8px 0 12px}
.appr .ah{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:2px}
.appr .ah h3{font-size:15px;font-weight:600;line-height:22px;letter-spacing:-.1px}
.appr .ah p{grid-column:1/-1;font-size:14px;line-height:20px;color:var(--t3)}
.appr .ah .bdg{grid-row:1;grid-column:2;border-radius:8px;gap:6px}
.blk{border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--b);overflow:hidden}
.blk .cwd{padding:8px 12px;border-bottom:1px solid var(--b);color:var(--t3);font-family:var(--mono);font-size:13px;line-height:20px}
.blk .cwd b{color:var(--t2);font-weight:400}
.diff{padding:8px 0;font-family:var(--mono);font-size:13px;line-height:20px;font-variant-ligatures:none}
.diff .l{display:flex;padding:0 12px;white-space:pre}
.diff .l b{width:20px;color:#a6a6a6;font-weight:400;text-align:right;margin-right:10px;flex:none}
.diff .l i{width:14px;color:var(--t3);flex:none}
.diff .l span{overflow:hidden;text-overflow:ellipsis}
.diff .l.a{background:rgba(49,207,118,.10)} .diff .l.a i{color:var(--ok)}
.diff .l.r{background:rgba(253,47,59,.11)} .diff .l.r i{color:var(--bad)}
.appr .note{gap:6px;font-size:13px;line-height:20px;color:var(--t3)}
.appr .ft{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.appr .ft .acts{display:flex;gap:8px;margin-left:auto}
.appr .ft .ghost{color:var(--t3);padding:0 8px;margin-left:-8px}
/* 输入区：外 0 6 6；框 min-h 96 圆角 14 padding 10；工具条 28 */
.cwrap{padding:0 6px 6px;flex:none}
.composer{min-height:96px;border:1px solid var(--bs);border-radius:14px;background:var(--surface);padding:10px;display:grid;gap:4px;grid-template-rows:1fr auto}
.composer .ph{padding:2px 4px;font-size:15px;line-height:22px;color:var(--t3);min-height:48px}
.ctool{min-height:28px;gap:6px}
.cbtn{width:28px;height:28px;border-radius:999px;background:var(--hover);color:var(--t3);display:grid;place-items:center;flex:none}
.cchip{height:28px;padding:0 10px;gap:6px;border-radius:999px;background:var(--hover);color:var(--t2);font-size:13px}
.csend{width:28px;height:28px;border-radius:999px;background:var(--light);color:var(--onlight);display:grid;place-items:center}

/* ===== 窗口页（详情 / 任务）：从工作区栏右侧铺满 ===== */
.wpage{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--canvas)}
.phd{height:49px;flex:none;padding:0 20px 0 24px;gap:6px;border-bottom:1px solid var(--line)}
.phd .par{font-size:14px;font-weight:500;color:var(--t3);white-space:nowrap}
.phd .sep{color:var(--t3)}
.phd .cur{font-size:15px;font-weight:600;white-space:nowrap}
.phd .ib{width:32px;height:32px;color:var(--t2)}
.dhero{padding:39px 24px 0;gap:12px}
.dhero .tx{flex:1;min-width:0;padding-left:6px}
.dhero h1{font-size:32px;line-height:38px;font-weight:500;letter-spacing:-.3px}
.dhero .sub{gap:8px;font-size:15px;line-height:22px;color:var(--t3);margin-top:6px}
.dhero .acts{gap:8px;align-self:flex-start;margin-top:3px}
.ddesc{margin:26px 24px 0;padding-bottom:22px;border-bottom:1px solid var(--line);font-size:15px;line-height:24px;color:var(--t2)}
.ddesc code{font-family:var(--mono);font-size:13px;background:var(--active);padding:1px 5px;border-radius:5px}
.dsplit{flex:1;min-height:0;display:flex;align-items:flex-start;gap:24px;padding:25px 24px 24px}
.dnav{width:192px;flex:none;display:flex;flex-direction:column;gap:4px}
.dnav a{display:block;border-radius:12px;padding:12px 13px;position:relative}
.dnav a b{display:block;font-size:15px;font-weight:500;line-height:22px;color:var(--t2)}
.dnav a small{display:block;font-size:14px;line-height:20px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnav a.on{background:var(--active)}
.dnav a.on b{color:var(--t1)}
.dnav a .cnt{position:absolute;right:12px;top:13px;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--warns);color:var(--warn);font-size:12px;font-weight:600;line-height:20px;text-align:center}
.dcard{flex:1;min-width:0;max-height:100%;background:var(--inset);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;overflow:hidden;font-size:15px;line-height:22px;color:var(--t2)}
.dcard .ch{gap:10px}
.dcard .ch b{font-size:15px;font-weight:600;color:var(--t1)}
.bigdiff{background:var(--canvas);border-radius:14px;padding:10px 0;font-family:var(--mono);font-size:13.5px;line-height:24px;font-variant-ligatures:none;color:var(--t2)}
.bigdiff .l{display:flex;padding:0 16px;white-space:pre}
.bigdiff .l b{width:30px;color:#a6a6a6;font-weight:400;text-align:right;margin-right:8px;flex:none}
.bigdiff .l b+b{margin-right:16px}
.bigdiff .l i{width:16px;color:var(--t3);flex:none}
.bigdiff .l.a{background:rgba(49,207,118,.10)} .bigdiff .l.a i{color:var(--ok)}
.bigdiff .l.r{background:rgba(253,47,59,.11)} .bigdiff .l.r i{color:var(--bad)}
.bigdiff .hunk{color:var(--acct);padding:2px 16px 6px;white-space:pre}
.ckpt{gap:10px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--surface);font-size:14px;color:var(--t2)}
.ckpt small{color:var(--t3);font-size:13px}
.plan li{list-style:none;display:grid;grid-template-columns:28px 1fr auto;column-gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.plan li:first-child{padding-top:2px}
.plan li:last-child{border-bottom:0}
.plan .k{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--t4);color:var(--t3);font-size:12px;font-weight:600}
.plan li.done .k{box-shadow:none;background:var(--oks);color:var(--ok)}
.plan li.cur .k{box-shadow:none;background:var(--warns);color:var(--warn)}
.plan b{display:block;font-size:15px;font-weight:500;line-height:24px;color:var(--t1)}
.plan li.done b{color:var(--t2)}
.plan p{font-size:14px;color:var(--t3);line-height:20px;margin-top:2px}
.tty{background:var(--canvas);border-radius:14px;padding:14px 16px;font-family:var(--mono);font-size:13.5px;line-height:23px;color:var(--t2);white-space:pre;overflow:hidden;font-variant-ligatures:none}
.tty .pr,.tty .d{color:var(--t3)} .tty .g{color:var(--ok)} .tty .r{color:var(--bad)}
.tty .hl{background:rgba(253,47,59,.11);margin:0 -16px;padding:0 16px;display:block}
.fail{background:var(--surface);border-radius:16px;padding:14px 16px}
.fail .fh{gap:8px;margin-bottom:8px}
.fail .fh b{font-size:15px;font-weight:500;color:var(--t1)}
.fail p{font-size:14px;color:var(--t2);line-height:22px}
.fail .who{gap:8px;margin:10px 0 4px;font-size:14px;color:var(--ny)}

/* ===== 任务页：居中 576 列 + 右侧 420 详情 ===== */
.tpage{flex:1;min-width:0;display:flex}
.tscroll{flex:1;min-width:0;padding:0 24px 32px;overflow:hidden}
.tcol{max-width:576px;margin:0 auto;display:flex;flex-direction:column;gap:4px}
.thd{padding:24px 8px 12px;gap:8px}
.thd b{font-size:15px;font-weight:600}
.thd .host{font-size:14px;color:var(--t3)}
.tcomp{min-height:48px;border-radius:24px;border:1px solid var(--bs);background:var(--surface);padding:7px 8px 7px 12px;gap:8px;margin:4px 0 8px}
.tcomp .ag{gap:6px;font-size:13px;color:var(--t2);padding:0 4px}
.tcomp .ph{flex:1;font-size:15px;color:var(--t3)}
.tsec{display:flex;flex-direction:column;gap:2px}
.tsec+.tsec{margin-top:16px}
.tsec h3{display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:13px;font-weight:500;color:var(--t3);line-height:18px}
.tsec h3 span+span{font-weight:400}
.trow{height:40px;display:grid;grid-template-columns:16px minmax(0,1fr) auto auto;gap:12px;align-items:center;border-radius:8px;padding:0 8px;font-size:14px}
.trow.on{background:var(--active)}
.trow .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .st{font-size:13px;color:var(--t3);white-space:nowrap}
.trow .st.att{color:var(--acct)} .trow .st.wk{color:var(--t2)}
.trow.cl{opacity:1} .trow.cl .tt{color:var(--t3)}
.glyph{width:16px;height:16px;display:grid;place-items:center;color:var(--t3)}
.tside{width:420px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column}
.tside .sh{height:38px;flex:none;padding:0 8px 0 14px;gap:8px;border-bottom:1px solid var(--line)}
.tside .sh b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tside .sb2{padding:16px;display:flex;flex-direction:column;gap:12px}
.mini{background:var(--surface);border-radius:14px;padding:14px 16px}
.mini .mh2{gap:8px;margin-bottom:8px}
.mini .mh2 b{font-size:15px;font-weight:500}
.mini .mh2 small{font-size:13px;color:var(--t3)}
.msteps li{list-style:none;display:flex;align-items:center;gap:10px;font-size:14px;line-height:20px;color:var(--t2);padding:5px 0}
.msteps .k{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--t4);color:var(--t3);font-size:11px;font-weight:600}
.msteps li.done{color:var(--t3)} .msteps li.done .k{box-shadow:none;background:var(--oks);color:var(--ok)}
.msteps li.cur{color:var(--t1)} .msteps li.cur .k{box-shadow:none;background:var(--warns);color:var(--warn)}
.soonbar{gap:10px;padding:12px 14px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);font-size:14px;color:var(--t2);margin-top:20px}
.soonbar small{display:block;font-size:13px;color:var(--t3);line-height:18px}

/* ===== 手机 ===== */
.phone{width:390px;height:844px;background:var(--canvas);position:relative;overflow:hidden;display:flex;flex-direction:column}
.stat{height:47px;flex:none;padding:14px 26px 0 32px;font-size:16px;font-weight:600;gap:6px}
.batt{width:25px;height:12px;border-radius:4px;box-shadow:inset 0 0 0 1.2px rgba(255,255,255,.45);position:relative}
.batt::after{content:"";position:absolute;left:2px;top:2px;bottom:2px;width:16px;border-radius:2px;background:var(--t1)}
.mbar{height:44px;flex:none;margin-top:8px;padding:0 16px;gap:12px}
.gl{width:48px;height:48px;border-radius:50%;background:rgba(38,38,40,.96);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12),0 2px 10px rgba(0,0,0,.35);display:grid;place-items:center;color:var(--t1);flex:none;margin:-2px 0}

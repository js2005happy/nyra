# Build the Nyra mobile app (Capacitor shell in mobile/) for Android.
#
# Runs only by hand (Actions → "Build mobile app" → Run workflow) or when a
# version tag (v*) is pushed, so it never slows down normal pushes / PRs.
#
# Output: an Android debug APK (nyra-android-debug.apk). The APK is uploaded
# as a workflow artifact, and on tag pushes attached to the GitHub Release
# (see docs/installers.md for the whole release picture).
#
# Why Capacitor, why Android-only for now: the phone UI is the PWA served by
# `nyra ui` (/m); the phone still talks to the computer. A TWA would need a
# public HTTPS origin (there is none), and Tauri Mobile would put a second
# mobile target inside desktop/ for a shell that still shells
# out to a `nyra` binary that doesn't exist on phones. Capacitor wraps the
# launcher page (mobile/www/) into a real APK with an icon and a standalone
# window; iOS needs an Apple Developer account + certificates, same as the
# desktop signing situation (docs/SIGNING.md), so it waits for that.
#
# The APK is debug-signed (Gradle's auto-generated debug keystore). A release
# keystore is a follow-up: it needs a user-owned keystore in CI secrets,
# same treatment as the OV certificate.

name: Build mobile app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      # Capacitor 8.6.2 的 :capacitor-android 模块以 source release 21 编译，
      # Java 17 的 javac 认不出 release 21（0.5.3 曾因此在 assembleDebug 失败），故用 21。
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Android SDK 36
        # Capacitor 8.6.2 targets compileSdk 36. The runner image usually
        # preinstalls it; install it if missing (sdkmanager is a no-op for
        # packages that are already installed).
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="sdkmanager"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || echo "::warning::SDK 36 安装失败，继续用 runner 自带的 SDK"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Install dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Add Android platform
        working-directory: mobile
        run: bun x cap add android

      - name: Sync web assets
        working-directory: mobile
        run: bun x cap sync android

      - name: Allow cleartext to the LAN gateway
        # 启动器页要跳明文 HTTP 的局域网地址，Android 9+ 默认会拦；
        # Capacitor 8 不会自己加这一行，见 mobile/scripts/ 里的说明。
        working-directory: mobile
        run: bash scripts/patch-android-manifest.sh

      - name: Generate icons and splash
        working-directory: mobile
        run: bun x @capacitor/assets generate --android

      - name: Stamp release version into the APK
        working-directory: mobile
        run: |
          # versionName = tag 去掉 v（如 0.5.3）；手动触发时用 package.json 的版本。
          # versionCode = 工作流运行号（单调递增，盖过旧版才能升级安装）。
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${{ github.ref_name }}"; VER="${VER#v}"
          else
            VER="$(bun -p "require('./package.json').version")"
          fi
          sed -i "s/versionName \".*\"/versionName \"$VER\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -E "versionName|versionCode" android/app/build.gradle

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy APK
        run: |
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/nyra-android-debug.apk
          ls -l dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nyra-android-debug
          path: dist/nyra-android-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach APK to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Nyra-android-debug
          path: dist

      - name: Attach to Release
        # 只挂文件，不写 body / 不生成 notes：Release 正文归 node-binaries
        # 的 release 作业管；这边先挂上也不会被后挂的覆盖。
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*

# 发布产物签名与来源证明（sigstore keyless + SLSA）
#
# 为什么用 keyless：开源项目不该把长期私钥塞进 CI secrets。cosign keyless 用
# GitHub 的 OIDC 令牌换一张 10 分钟有效的短期证书，签名记录进 Rekor 透明日志，
# 任何人都能离线验证"这个产物确实由本仓库的这条 workflow 构建"。
#
# 产出（挂到同一个 Release）：
#   SHA256SUMS              所有产物的哈希清单（5 个 Node 二进制 + 桌面
#                           安装包 .dmg/.msi/-setup.exe + 安卓 APK）
#   SHA256SUMS.sig          对清单的 cosign 签名（keyless）
#   SHA256SUMS.pem          签名时的短期证书（含 OIDC 身份）
#   SHA256SUMS.bundle       sigstore bundle（签名+证书+Rekor 凭证，一体化验证用）
#   *.intoto.jsonl          每个产物的 SLSA 来源证明（attest-build-provenance）
#
# 触发：Release 发布后自动跑；也可手动指定 tag。
# 前置：仓库 Settings → Actions → General 里允许 GitHub Actions 创建 attestation
#       （公共仓库默认允许）。

name: Sign release artifacts

on:
  release:
    types: [published]
  # 注意：Release 是 CI 用默认 GITHUB_TOKEN 建的（node-binaries.yml 的
  # softprops/action-gh-release），GitHub 不会因此触发 `release` 工作流
  # ——用 GITHUB_TOKEN 触发的事件（除 workflow_dispatch /
  # repository_dispatch 外）不会再触发新的 workflow run。所以只靠
  # `release: published` 时签名工作流根本不会启动，这就是 v0.5.2 起
  # SHA256SUMS 缺失的另一半根因（另一半是下面的 --jq -r 写法）。
  # 改走 workflow_run：Node binaries 跑完（它负责建 Release）即触发，
  # 等待循环再等桌面/手机产物挂齐；手动建的 Release 仍走 release 事件。
  workflow_run:
    workflows: ["Node binaries"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: '要签名的 Release tag（例如 v0.5.0）'
        required: true

permissions:
  contents: write       # 回传签名文件到 Release
  id-token: write       # keyless 签名换取 OIDC 令牌
  attestations: write   # 写 SLSA 来源证明

concurrency:
  group: release-sign-${{ github.event.release.tag_name || inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  sign:
    name: Sign + attest
    # workflow_run 会在 Node binaries 每次跑完都触发（main 推送、PR 也
    # 在内）：只有跑成功且是打 v* tag 的那次才签，其余直接跳过。
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag || github.event.workflow_run.head_branch }}"
          if [ -z "$TAG" ]; then echo "缺少 tag"; exit 1; fi
          case "$TAG" in
            v*) ;;
            *) echo "tag 须以 v 开头：$TAG"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout (for verify script)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 竞态：Node binaries 工作流在 tag 触发后才把产物挂到 Release 上，
          # 本工作流可能比它先跑到这一步。v0.5.1 就因此空手失败过（20:30 跑、
          # 20:32 二进制才挂上）。先等全部产物都出现再下载；桌面 Tauri 构建
          # （macOS 通用包 + Windows）比 Node 二进制慢得多（15–30 分钟），
          # 手机 Gradle 构建也要约 10 分钟，所以上限放宽到 50 分钟；
          # 等不到就按原样失败（fail-closed，不签不全的清单）。
          TAG="${{ steps.tag.outputs.tag }}"
          for i in $(seq 1 150); do
            # gh 的 --jq 只接受一个参数，绝不能再跟 -r：-r 会被当成 jq
            # 表达式，真正的表达式变成多余位置参数，gh 报
            # "accepts at most 1 arg(s), received 2" 直接退出；这一步在
            # bash -e 下一失败整个 job 就红了，v0.5.2 起的签名就是这么
            # 断的。|| true 让偶发的 gh 失败只算“这次没等到”，继续等。
            NAMES=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' || true)
            MISSING=0
            for b in nyra-linux-arm64 nyra-linux-x64 nyra-macos-arm64 nyra-macos-x64 nyra-windows-x64.exe; do
              echo "$NAMES" | grep -qx "$b" || MISSING=1
            done
            # 桌面安装包（Tauri 打包的文件名带版本号，用后缀匹配）与手机 APK：
            # .dmg（macOS 通用包）、.msi 与 -setup.exe（Windows）、nyra-android-debug.apk。
            echo "$NAMES" | grep -q '\.dmg$' || MISSING=1
            echo "$NAMES" | grep -q '\.msi$' || MISSING=1
            echo "$NAMES" | grep -q '\-setup\.exe$' || MISSING=1
            echo "$NAMES" | grep -qx 'nyra-android-debug.apk' || MISSING=1
            [ "$MISSING" = 0 ] && break
            echo "等待产物挂到 Release（第 $i/150 次）：5 个 Node 二进制 + .dmg + .msi + -setup.exe + 安卓 APK ..."
            sleep 20
          done
          # fail-closed：等满 50 分钟仍缺产物就直接失败，不签不全的清单。
          # （以前这里没有出口，超时后会照常下载、签名一份不全的清单。）
          if [ "$MISSING" != "0" ]; then
            echo "::error::等了 50 分钟，Release $TAG 上仍缺产物（5 个 Node 二进制 + .dmg + .msi + -setup.exe + 安卓 APK），不签不全的清单"
            exit 1
          fi
          mkdir -p dist
          gh release download "$TAG" \
            --repo "${{ github.repository }}" --dir dist --clobber
          echo "--- 下载到的产物 ---"
          ls -la dist

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          # 排除上一次运行可能残留的签名文件，避免自我签名
          find . -maxdepth 1 -type f \
            ! -name 'SHA256SUMS*' ! -name '*.intoto.jsonl' \
            -printf '%f\n' | sort | xargs -r -d '\n' sha256sum > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Sign SHA256SUMS (keyless)
        working-directory: dist
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            --bundle SHA256SUMS.bundle \
            SHA256SUMS
          echo "--- 签名文件 ---"
          ls -la SHA256SUMS*

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/*

      - name: Upload signatures back to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sig \
            dist/SHA256SUMS.pem \
            dist/SHA256SUMS.bundle \
            --repo "${{ github.repository }}" --clobber

      - name: Verify our own signature (fail closed)
        working-directory: dist
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign verify-blob --bundle SHA256SUMS.bundle \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/release-sign\.yml@refs/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
          echo "✅ 自身签名验证通过"

      - name: Summary
        run: |
          {
            echo "## 签名完成：${{ steps.tag.outputs.tag }}"
            echo ""
            echo "已签名产物："
            sed 's/^/  - /' dist/SHA256SUMS
            echo ""
            echo "用户验证方式见 docs/SIGNING.md"
          } >> "$GITHUB_STEP_SUMMARY"

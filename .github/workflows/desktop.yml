# Build the Nyra desktop app (Tauri shell in desktop/) for macOS, Windows and Linux.
#
# Runs only by hand (Actions → "Build desktop app" → Run workflow) or when a
# version tag (v*) is pushed, so it never slows down normal pushes / PRs.
# On tag pushes the installers are attached to the GitHub Release by the
# `release` job below (0.5.3 起，不再手动传；机制见 docs/installers.md).
# The `release` job only attaches files; the Release body / notes belong to
# node-binaries' release job.
#
# Code signing is conditional (see docs/SIGNING.md): if the signing secrets
# are configured, the build signs (Windows: OV certificate from
# WINDOWS_CERTIFICATE/WINDOWS_CERTIFICATE_PASSWORD, imported into the cert
# store and passed to `tauri build --config`; macOS: Developer ID
# certificate from APPLE_CERTIFICATE/APPLE_CERTIFICATE_PASSWORD, imported
# into a temporary keychain, plus APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID for
# notarization). If no signing secrets exist, the build runs exactly as
# before and the installers are unsigned: macOS gets the standard ad-hoc
# signature only (signingIdentity "-"), which is not a developer identity
# and is not notarized; Windows .msi/.exe are unsigned. A half-configured
# secret set fails the build loudly instead of silently shipping unsigned.
#
# 0.5.3 起安装包自带同版本的 nyra 命令行（Tauri sidecar，bundle.externalBin =
# binaries/nyra-cli）：每个平台先用 Bun 从同一提交编出 CLI，放到
# desktop/src-tauri/binaries/nyra-cli-<target triple>[.exe]（macOS 通用包另用
# lipo 合成 nyra-cli-universal-apple-darwin），再 `tauri build`。桌面外壳按
# NYRA_BIN → 自带 CLI → PATH 上的 nyra → 安装目录 的顺序找 CLI，找到的版本与
# 桌面版本不一致时改用自带的（`nyra ui --host 127.0.0.1 --port 0 --print-url-json`）。

name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # 签名秘密先映射到 job 级 env：GitHub 不允许在 `if:` 里直接引用 secrets
    #（官方文档：“Secrets cannot be directly referenced in `if:` conditionals.
    # Instead, consider setting secrets as job-level environment variables,
    # then referencing the environment variables to conditionally run steps.”），
    #所以下面两个导入步骤的条件判断一律读 env.*。两个 matrix 任务都会拿到
    #这些 env，但只有对应平台的导入步骤会读它们；秘密在日志里仍会被打码。
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin --bundles app,dmg
            bundle_dir: desktop/src-tauri/target/universal-apple-darwin/release/bundle
            artifact: Nyra-macos-universal
            files: |
              desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows (x64)
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: --bundles msi,nsis
            bundle_dir: desktop/src-tauri/target/release/bundle
            artifact: Nyra-windows-x64
            files: |
              desktop/src-tauri/target/release/bundle/msi/*.msi
              desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux (x64)
            os: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            tauri_args: --bundles appimage,deb
            bundle_dir: desktop/src-tauri/target/release/bundle
            artifact: Nyra-linux-x64
            files: |
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/deb/*.deb
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # H9 发版缓存隔离：不用 setup-node 内置的 npm 缓存——它的键只含
      # OS + 锁文件哈希，不含分支，一个分支的缓存会被另一个分支直接复用。
      # 这里用显式 actions/cache，键里钉死 github.ref（分支/tag 全名），
      # restore-keys 只回落到同一分支的前缀，绝不跨分支串味；发版 tag 构建
      # （v*）每次都是新键，从干净缓存起步。
      - name: Cache npm dependencies (branch-scoped)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ github.ref }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ github.ref }}-

      - name: Check versions match
        # Runs after Set up Node on purpose: the check itself uses `node -p`.
        # Source of truth is the root package.json (Node version); the Python
        # package (nyra/__init__.py) was removed in 0.4.0.
        run: |
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/src-tauri/Cargo.toml | head -1)
          desk=$(node -p "require('./desktop/package.json').version")
          echo "package.json=$pkg tauri.conf=$conf Cargo.toml=$cargo desktop/package.json=$desk"
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$cargo" ] || [ "$pkg" != "$desk" ]; then
            echo "::error::desktop version must match package.json ($pkg)"; exit 1
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # man-db 的触发器会让 GitHub runner 上的 apt install 慢到十几分钟
          # （v0.5.3 第一次 Linux 构建卡在这一步），先关掉它的自动更新。
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      # 自带 CLI（sidecar）：同一提交编出的 nyra，文件名带 target triple，
      # 放在 tauri.conf.json 的 externalBin 期望的位置。必须在 Rust 单元测试
      # 之前：tauri-build 编译时就检查 sidecar 文件是否存在。
      - name: Build bundled nyra CLI (sidecar)
        run: |
          set -euo pipefail
          BIN=desktop/src-tauri/binaries
          mkdir -p "$BIN"
          want=$(node -p "require('./package.json').version")
          # 直接调 bun build（与 scripts/build-binaries.sh 同一条命令）：macOS 自带
          # bash 3.2 解析不了那个脚本里紧跟变量名的全角括号（v0.5.3 首次构建即报
          # “name: unbound variable”）。
          cli() { bun build --compile --target="$1" --outfile "dist-cli/$2" src/cli.ts; }
          mkdir -p dist-cli
          case "$RUNNER_OS" in
            macOS)
              cli bun-darwin-arm64 nyra-macos-arm64
              cli bun-darwin-x64 nyra-macos-x64
              cp dist-cli/nyra-macos-arm64 "$BIN/nyra-cli-aarch64-apple-darwin"
              cp dist-cli/nyra-macos-x64 "$BIN/nyra-cli-x86_64-apple-darwin"
              lipo -create -output "$BIN/nyra-cli-universal-apple-darwin" dist-cli/nyra-macos-arm64 dist-cli/nyra-macos-x64
              host="$BIN/nyra-cli-$(rustc -vV 2>/dev/null | sed -n 's/^host: //p' || true)"
              [ -f "$host" ] || host="$BIN/nyra-cli-universal-apple-darwin"
              ;;
            Windows)
              cli bun-windows-x64 nyra-windows-x64.exe
              cp dist-cli/nyra-windows-x64.exe "$BIN/nyra-cli-x86_64-pc-windows-msvc.exe"
              host="$BIN/nyra-cli-x86_64-pc-windows-msvc.exe"
              ;;
            Linux)
              cli bun-linux-x64 nyra-linux-x64
              cp dist-cli/nyra-linux-x64 "$BIN/nyra-cli-x86_64-unknown-linux-gnu"
              host="$BIN/nyra-cli-x86_64-unknown-linux-gnu"
              ;;
          esac
          chmod +x "$BIN"/nyra-cli-* || true
          ls -l "$BIN"
          export NYRA_HOME="$RUNNER_TEMP/.nyra-sidecar-check"
          got=$("$host" --version)
          echo "sidecar: $got"
          case "$got" in
            *"$want"*"node runtime"*) ;;
            *) echo "::error::bundled CLI reports '$got', expected $want (node runtime)"; exit 1 ;;
          esac

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # H9 发版缓存隔离：rust-cache 的默认键只按 job + Rust 环境哈希，
      # 不含分支，跨分支会复用同一个 target/ 缓存。key 里钉死 github.ref，
      # 一个分支/tag 的 Rust 构建缓存绝不被另一个分支复用。
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ github.ref }}

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Rust unit tests
        working-directory: desktop/src-tauri
        run: cargo test --locked

      # --- 条件签名接线（docs/SIGNING.md） ---------------------------------
      # 两步只在对应平台 + 证书秘密存在时跑；秘密一个都没有时整步跳过，
      # 构建与以前完全一致（未签名）。秘密只配了一半时里面直接报错退出，
      # 绝不悄悄出未签名包。证书只活在本次 runner 里，不进 git。
      - name: Import Windows certificate (if configured)
        if: matrix.os == 'windows-latest' && (env.WINDOWS_CERTIFICATE != '' || env.WINDOWS_CERTIFICATE_PASSWORD != '')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            Write-Error "WINDOWS_CERTIFICATE 与 WINDOWS_CERTIFICATE_PASSWORD 必须同时配置（只配了一个），构建已停住而不是悄悄出未签名包"
            exit 1
          }
          # 步骤照 Tauri 官方 Windows 签名文档：base64 解码出 .pfx、导入证书库。
          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt
          $cert = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)
          Remove-Item certificate/certificate.pfx
          # thumbprint 写进 --config 覆盖文件（tauri.conf.json 本身不动，
          # `tauri build --config` 会把它与默认配置合并）；密码不进文件。
          $signingConfig = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = 'http://timestamp.digicert.com'
              }
            }
          } | ConvertTo-Json -Compress -Depth 5
          Set-Content -Path desktop/signing-config.json -Value $signingConfig
          Write-Host "Windows signing enabled: certificate imported, thumbprint $($cert.Thumbprint)"

      - name: Import Apple certificate (if configured)
        if: matrix.os == 'macos-latest' && (env.APPLE_CERTIFICATE != '' || env.APPLE_CERTIFICATE_PASSWORD != '')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::error::APPLE_CERTIFICATE 与 APPLE_CERTIFICATE_PASSWORD 必须同时配置（只配了一个），构建已停住而不是悄悄出未签名包"; exit 1
          fi
          if [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "::error::APPLE_CERTIFICATE 已配置，但 KEYCHAIN_PASSWORD 为空（建临时钥匙串需要它）"; exit 1
          fi
          # 步骤照 Tauri 官方 macOS 签名文档：base64 解码出 .p12、导入临时钥匙串。
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f certificate.p12
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -z "$CERT_ID" ]; then echo "::error::导入的证书里没有找到 Developer ID Application 身份"; exit 1; fi
          # 签名身份走 --config 覆盖文件（盖掉 tauri.conf.json 里的 "-"），
          # 公证凭证走环境变量（Tauri 构建时自动公证；只配了签名没配公证
          # 时只签名不公证，不报错）。
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          [ -n "$APPLE_ID" ] && echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          [ -n "$APPLE_PASSWORD" ] && echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
          [ -n "$APPLE_TEAM_ID" ] && echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          node -e "const fs=require('fs');fs.writeFileSync('desktop/signing-config.json',JSON.stringify({bundle:{macOS:{signingIdentity:process.argv[1]}}}));" "$CERT_ID"
          echo "macOS signing enabled: $CERT_ID"

      - name: Build installers
        working-directory: desktop
        run: |
          # signing-config.json 只有上面导入证书的步骤成功时才存在；
          # 不存在时走原来的无签名构建，行为与以前完全一致。
          # Linux AppImage：不让 linuxdeploy strip（Bun 编出的单文件 CLI 不能被 strip）。
          export NO_STRIP=true
          if [ -f signing-config.json ]; then
            echo "Signing enabled: building with signing-config.json"
            npx tauri build ${{ matrix.tauri_args }} --config signing-config.json
          else
            echo "Signing not configured: building unsigned"
            # 注意：上面 job 级 env 把签名秘密映射成了环境变量，没配秘密时它们是
            # 空字符串。Tauri 打包器只要检测到 APPLE_CERTIFICATE 存在（即使是空值）
            # 就会尝试把它当 .p12 导入，空值导致 security import 解码失败
            # （桌面 #23 macOS 失败的根因；0.5.0 没映射这些变量所以是绿的）。
            # 无签名构建前必须先 unset，否则“未签名构建”会在打包阶段失败。
            unset WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD
            npx tauri build ${{ matrix.tauri_args }}
          fi

      - name: List bundles
        run: find "${{ matrix.bundle_dir }}" -maxdepth 2 -type f -exec ls -l {} \;

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach installers to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: Nyra-*
          path: dist
          merge-multiple: true

      - name: Add stable-name copies
        # README / 官网的「下载」按钮链 releases/latest/download/<稳定名>，
        # 不随版本号变：每个安装包另挂一份不带版本号的副本（内容完全相同，SHA256SUMS 一并覆盖）。
        run: |
          set -euo pipefail
          mkdir -p dist/stable
          one(){ local pat="$1" out="$2"; local f; f=$(find dist -type f -name "$pat" ! -path 'dist/stable/*' | head -1); [ -n "$f" ] || { echo "::error::找不到 $pat"; exit 1; }; cp "$f" "dist/stable/$out"; echo "$f -> $out"; }
          one '*_x64-setup.exe' Nyra-windows-x64-setup.exe
          one '*_x64_en-US.msi' Nyra-windows-x64.msi
          one '*_universal.dmg' Nyra-macos-universal.dmg
          one '*_amd64.AppImage' Nyra-linux-x86_64.AppImage
          one '*_amd64.deb' Nyra-linux-amd64.deb
          ls -l dist/stable

      - name: Attach to Release
        # 只挂文件，不写 body / 不生成 notes：Release 正文归 node-binaries
        # 的 release 作业管；这边先挂上也不会被后挂的覆盖。
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # Windows 的 artifact 根目录是 bundle/（msi 与 nsis 的公共上级），
          # merge-multiple 下载后是 dist/msi/*.msi、dist/nsis/*.exe；只写
          # dist/* 会漏掉子目录里的 Windows 安装包（v0.5.3 首次 tag 构建即如此）。
          files: |
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.deb

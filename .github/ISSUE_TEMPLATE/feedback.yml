name: 内测体验反馈 / Beta feedback
description: 好用、不好用、看不懂、希望加什么，都欢迎说。 / What works, what doesn't, what's confusing, what you'd like added.
title: "[体验 / Feedback] "
labels: ["内测", "体验反馈"]
body:
  - type: markdown
    attributes:
      value: |
        随便说，不用写得很正式。
        **⚠️ 请勿粘贴 API Key、密码、配对码或任何私密信息。**

        Say whatever is on your mind; no need to be formal. Chinese or English are both fine.
        **⚠️ Never paste API keys, passwords, pairing codes or any private information.**
  - type: dropdown
    id: platform
    attributes:
      label: 平台 / Platform
      multiple: true
      options:
        - Windows 桌面应用 / Windows desktop app
        - macOS 桌面应用 / macOS desktop app
        - Linux 桌面应用（AppImage / deb） / Linux desktop app (AppImage / deb)
        - 命令行（终端里的 nyra） / Command line (nyra in a terminal)
        - 电脑浏览器网页界面（nyra ui） / Web interface in a desktop browser (nyra ui)
        - 手机网页（/m） / Mobile web page (/m)
        - 安卓 App（APK） / Android app (APK)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nyra 版本 / Nyra version
      description: 终端里运行 `nyra --version`，或在 设置 → 关于 里看。 / Run `nyra --version` in a terminal, or check Settings → About.
      placeholder: 例如 / e.g. nyra 0.5.13
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 关于哪一块 / Which area
      multiple: true
      options:
        - 安装与第一次配置 / Installing and first-time setup
        - 配置模型 / Key / Setting up a model / key
        - 对话与回复质量 / Conversations and reply quality
        - 审批卡与权限模式 / Approval cards and permission modes
        - 手机连电脑 / Connecting a phone to the computer
        - 自动化 / 定时任务 / Automations / scheduled tasks
        - 总指挥团队 / Lead agent and team
        - 界面与文字 / Interface and wording
        - 其他 / Other
  - type: textarea
    id: feedback
    attributes:
      label: 你的感受 / Your experience
      description: 哪里顺手、哪里卡住、哪里看不懂？ / What felt smooth, where did you get stuck, what was confusing?
    validations:
      required: true
  - type: textarea
    id: wish
    attributes:
      label: 希望怎么改（可选） / What you'd change (optional)
  - type: textarea
    id: screenshots
    attributes:
      label: 截图（可选） / Screenshots (optional)
      description: 截图前确认画面里没有 Key、密码或配对码。 / Make sure no keys, passwords or pairing codes are visible.
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认 / Before you submit
      options:
        - label: 我确认上面没有贴 API Key、密码、配对码或其他私密信息。 / I confirm I haven't pasted any API keys, passwords, pairing codes or other private information above.
          required: true

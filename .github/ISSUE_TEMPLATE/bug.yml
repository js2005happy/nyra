name: 内测问题反馈（Bug） / Beta bug report
description: 装不上、打不开、报错、结果不对，都用这个。 / Won't install, won't open, errors or wrong results.
title: "[Bug] "
labels: ["内测", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢你帮 Nyra 找问题！
        **⚠️ 请勿粘贴 API Key、密码、配对码或任何私密信息。** 贴日志和截图前先检查一遍，把 Key 打码（例如 `sk-****`）。

        Thanks for helping find problems in Nyra! Feel free to write in Chinese or English.
        **⚠️ Never paste API keys, passwords, pairing codes or any private information.** Check logs and screenshots before posting, and mask keys (e.g. `sk-****`).
  - type: dropdown
    id: platform
    attributes:
      label: 平台 / Platform
      description: 在哪里遇到的问题？可多选。 / Where did it happen? Pick all that apply.
      multiple: true
      options:
        - Windows 桌面应用 / Windows desktop app
        - macOS 桌面应用 / macOS desktop app
        - Linux 桌面应用（AppImage / deb） / Linux desktop app (AppImage / deb)
        - 命令行（终端里的 nyra） / Command line (nyra in a terminal)
        - 电脑浏览器网页界面（nyra ui） / Web interface in a desktop browser (nyra ui)
        - 手机网页（/m） / Mobile web page (/m)
        - 安卓 App（APK） / Android app (APK)
        - 一键安装脚本 / One-line install script
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nyra 版本 / Nyra version
      description: 终端里运行 `nyra --version`，或在 设置 → 关于 里看。 / Run `nyra --version` in a terminal, or check Settings → About.
      placeholder: 例如 / e.g. nyra 0.5.13
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统版本 / OS version
      placeholder: 例如 / e.g. Windows 11 23H2 / macOS 15.2 / Ubuntu 24.04 / Android 15
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 一两句话说清楚问题，以及你本来期望看到什么。 / Describe the problem in a sentence or two, and what you expected to see.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 按顺序写下怎么操作能再次遇到这个问题。 / List, in order, what to do to hit the problem again.
      placeholder: |
        1. 打开 / Open …
        2. 输入 / Type …
        3. 点 / Click …
        4. 看到 / See …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 报错信息或日志（可选） / Error messages or logs (optional)
      description: 终端输出、`nyra doctor` 的结果等。**先把 Key 和私密路径打码。** / Terminal output, `nyra doctor` results, etc. **Mask keys and private paths first.**
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: 截图（可选） / Screenshots (optional)
      description: 直接把图片拖进来。截图前确认画面里没有 Key、密码或配对码。 / Drag images in here. Make sure no keys, passwords or pairing codes are visible.
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认 / Before you submit
      options:
        - label: 我确认上面没有贴 API Key、密码、配对码或其他私密信息。 / I confirm I haven't pasted any API keys, passwords, pairing codes or other private information above.
          required: true
